version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: julia
    directories:
      - "/"
      - "/docs"
      - "/test"
      - "/gen"
    schedule:
      interval: weekly
    groups:
      julia:
        update-types: [minor, patch]
