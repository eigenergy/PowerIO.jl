name: Register Package

# Sets the version in Project.toml, commits it to main, and posts the
# `@JuliaRegistrator register` comment on that commit. The General registry PR
# AutoMerges (~15 minutes for new versions); TagBot then tags here. A green
# run only means the comment was posted: registration errors (duplicate
# version, compat problems) surface as Registrator replies on the commit
# thread and on the General PR. Manual fallback: comment
# `@JuliaRegistrator register` on any commit — also the recourse if a dispatch
# breaks after a runner Node bump (upstream is dormant; the runner
# force-migrates its node16 runtime).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to register (no leading v), or the component to bump (major/minor/patch)
        required: true

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/RegisterAction@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
