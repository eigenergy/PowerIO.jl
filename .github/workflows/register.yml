name: Register Package

# Register only a tested immutable main commit. Update artifacts supplies both
# inputs; manual dispatch retries that same reviewed intent. This workflow does
# not edit, commit, rebase, or push.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed PowerIO version, without v
        required: true
      expected_sha:
        description: Exact 40-character main commit tested by Update artifacts
        required: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: register-package
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: "1"
      - name: Instantiate the release tools
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Revalidate the immutable release state
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::version must be X.Y.Z"; exit 1;
          }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::expected_sha must be a full lowercase commit SHA"; exit 1;
          }
          [ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ] || {
            echo "::error::checkout does not match expected_sha"; exit 1;
          }
          git fetch origin main
          julia --project=. gen/release_state.jl check-exact-sha "$EXPECTED_SHA"

          julia --project=. gen/release_state.jl initial \
            workflow_dispatch "" "$RUNNER_TEMP/intent-status.toml"
          julia --project=. gen/release_state.jl github-output \
            "$RUNNER_TEMP/intent-status.toml" "$RUNNER_TEMP/intent-output"
          intent_status=$(sed -n 's/^status=//p' "$RUNNER_TEMP/intent-output")
          intent_version=$(sed -n 's/^version=//p' "$RUNNER_TEMP/intent-output")
          tag=$(sed -n 's/^tag=//p' "$RUNNER_TEMP/intent-output")
          [ "$intent_status" = ready ] || {
            echo "::error::release intent is not ready"; exit 1;
          }
          [ "$intent_version" = "$INPUT_VERSION" ] || {
            echo "::error::input version does not match reviewed intent"; exit 1;
          }
          julia --project=. gen/release_state.jl check

          release="$RUNNER_TEMP/powerio-release.json"
          code=$(curl --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --output "$release" --write-out '%{http_code}' \
            "https://api.github.com/repos/eigenergy/powerio/releases/tags/$tag")
          [ "$code" = 200 ] || {
            echo "::error::exact powerio release lookup returned HTTP $code"; exit 1;
          }
          open_prs=$(gh pr list --state open --limit 100 --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("artifacts/"))] | length')
          general="$RUNNER_TEMP/Versions.toml"
          code=$(curl --silent --show-error --location \
            --output "$general" --write-out '%{http_code}' \
            https://raw.githubusercontent.com/JuliaRegistries/General/master/P/PowerIO/Versions.toml)
          julia --project=. gen/release_state.jl check-registry-http "$code"
          julia --project=. gen/release_state.jl release \
            "$release" "$open_prs" "$general" "$RUNNER_TEMP/release-status.toml"
          julia --project=. gen/release_state.jl github-output \
            "$RUNNER_TEMP/release-status.toml" "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/release-status.toml" >> "$GITHUB_STEP_SUMMARY"

          state=$(julia --project=. -e \
            'using TOML; print(TOML.parsefile(ARGS[1])["status"])' \
            "$RUNNER_TEMP/release-status.toml")
          [ "$state" = ready ] || [ "$state" = registered ] || {
            echo "::error::registration gate returned $state"; exit 1;
          }

      - name: Test the exact registration tree
        if: steps.gate.outputs.status == 'ready'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # The interpolation below belongs to Julia.
          # shellcheck disable=SC2016
          julia --project=. -e '
            using PowerIO
            version = ENV["VERSION"]
            PowerIO.library_available() || error("artifact failed the core ABI handshake")
            f = PowerIO.features()
            all(values(f)) || error("artifact is missing a usable feature: $f")
            for name in ("arrow", "matrix", "gridfm", "dist", "pkg", "prob")
                PowerIO.has_feature(name) || error("artifact does not report feature $name")
            end
            PowerIO.schema_versions().powerio_version == version ||
                error("schema report does not identify powerio $version")
            info = PowerIO.build_info()
            info === nothing && error("artifact has no build information")
            String(info.powerio_version) == version || error("build report version mismatch")
          '
          julia --project=. -e 'using Pkg; Pkg.test()'
          git diff --quiet || {
            echo "::error::registration validation changed the source tree"; exit 1;
          }

      - name: Post the exact SHA Registrator request
        if: steps.gate.outputs.status == 'ready'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          git fetch origin main
          julia --project=. gen/release_state.jl check-exact-sha "$EXPECTED_SHA"
          comments="$RUNNER_TEMP/commit-comments.json"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_SHA}/comments?per_page=100" \
            > "$comments"
          cutoff=$(date -u --date='6 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
          action=$(julia --project=. gen/release_state.jl \
            registration-comment-action "$comments" "$cutoff")
          if [ "$action" = wait ]; then
            echo "A registration request for $EXPECTED_SHA was posted in the last six hours." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          notes=$(awk '/^## /{n++; if (n == 2) exit} n >= 1' CHANGELOG.md)
          body=$(printf '@JuliaRegistrator register\n\nRelease notes:\n\n%s\n' "$notes")
          gh api "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_SHA}/comments" -f body="$body"
          echo "Posted the Registrator request on $EXPECTED_SHA." \
            | tee -a "$GITHUB_STEP_SUMMARY"
