name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.9', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      # Build the C ABI from powerio's main so the ccall tests run against the real
      # library instead of skipping (they auto-skip when the cdylib is absent).
      # Drops to `using PowerIO_jll` once that is registered (issue #1).
      - name: Check out powerio
        uses: actions/checkout@v4
        with:
          repository: eigenergy/powerio
          path: powerio
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: powerio
      - name: Build powerio-capi
        run: cargo build -p powerio-capi --release --manifest-path powerio/Cargo.toml
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          POWERIO_CAPI: ${{ github.workspace }}/powerio/target/release/libpowerio_capi.so
