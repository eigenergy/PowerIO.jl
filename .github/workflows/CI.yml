name: CI
on:
  push:
    branches: [main, feat/deterministic-ptdf]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1']
    env:
      JULIA_NUM_THREADS: "4"
      PAIRED_RELEASES: ${{ vars.PAIRED_RELEASES }}
      POWERIO_REQUIRE_LIBRARY: "1"
      # secrets can't be read in `if:` directly; expose it as an env var to gate on.
      POWERIO_TOKEN: ${{ secrets.POWERIO_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0
      # Build the C ABI from a sibling powerio checkout so the ccall tests run for
      # real. The probe checks out eigenergy/powerio anonymously when it is public;
      # while it is private, add a token with read access to it as the
      # POWERIO_REPO_TOKEN secret. With neither, the build is skipped and the ccall
      # tests auto-skip (the pure-Julia tests still run). Drops to
      # `using PowerIO_jll` once that is registered (issue #1).
      - name: Probe powerio access
        id: powerio
        run: |
          if [ -n "${POWERIO_TOKEN}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote https://github.com/eigenergy/powerio.git HEAD >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "eigenergy/powerio is unreachable (no POWERIO_REPO_TOKEN secret, and the repo is not public); the ccall tests will skip."
          fi
      - name: Select powerio branch
        id: powerio-ref
        if: steps.powerio.outputs.available == 'true'
        env:
          POWERIO_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          remote="https://github.com/eigenergy/powerio.git"
          if [ -n "${POWERIO_TOKEN}" ]; then
            remote="https://x-access-token:${POWERIO_TOKEN}@github.com/eigenergy/powerio.git"
          fi
          if git ls-remote --exit-code --heads "$remote" "$POWERIO_BRANCH" >/dev/null 2>&1; then
            echo "ref=$POWERIO_BRANCH" >> "$GITHUB_OUTPUT"
            echo "Using eigenergy/powerio branch $POWERIO_BRANCH"
          elif [ -f .github/powerio-companion ] && \
               companion="$(tr -d '[:space:]' < .github/powerio-companion)" && \
               [ -n "$companion" ] && \
               git ls-remote --exit-code --heads "$remote" "$companion" >/dev/null 2>&1; then
            echo "ref=$companion" >> "$GITHUB_OUTPUT"
            echo "::warning::companion branch $POWERIO_BRANCH not found in eigenergy/powerio; using $companion from .github/powerio-companion"
            echo "Using eigenergy/powerio branch $companion (.github/powerio-companion); no branch named $POWERIO_BRANCH exists"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "Using eigenergy/powerio main; no branch named $POWERIO_BRANCH exists"
          fi
      - name: Clone powerio companion
        if: steps.powerio.outputs.available == 'true'
        env:
          POWERIO_REF: ${{ steps.powerio-ref.outputs.ref }}
        run: |
          # Clone directly instead of actions/checkout: the companion repository
          # has no .gitmodules file for a gitlink named "powerio", which makes
          # checkout's post-job submodule cleanup fail with exit code 128.
          remote="https://github.com/eigenergy/powerio.git"
          if [ -n "${POWERIO_TOKEN}" ]; then
            auth="$(printf 'x-access-token:%s' "${POWERIO_TOKEN}" | base64 | tr -d '\n')"
            git -c http.extraheader="AUTHORIZATION: basic ${auth}" clone --depth 1 --branch "${POWERIO_REF}" "$remote" "$RUNNER_TEMP/powerio"
          else
            git clone --depth 1 --branch "${POWERIO_REF}" "$remote" "$RUNNER_TEMP/powerio"
          fi
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: steps.powerio.outputs.available == 'true'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.powerio.outputs.available == 'true'
        with:
          workspaces: ${{ runner.temp }}/powerio
      - name: Build powerio-capi
        if: steps.powerio.outputs.available == 'true'
        # Build the optional features the checked-out Rust branch supports. Before
        # the v0.6.1 Rust PRs merge, matrix and normalize options tests skip; once
        # they land, this job exercises them.
        run: |
          features=arrow,gridfm,dist
          if grep -q '^matrix = ' $RUNNER_TEMP/powerio/powerio-capi/Cargo.toml; then
            features="$features,matrix"
          fi
          if grep -q '^prob = ' "$RUNNER_TEMP/powerio/powerio-capi/Cargo.toml"; then
            features="$features,prob"
          fi
          cargo build -p powerio-capi --release --features "$features" --manifest-path "$RUNNER_TEMP/powerio/Cargo.toml"
      # src/LibPowerIO.jl is generated from the checked out header. Regenerating
      # it here turns a header change that nobody regenerated against into a diff.
      - name: Check the generated raw layer is current
        if: steps.powerio.outputs.available == 'true' && matrix.julia-version == '1'
        run: |
          julia --project=gen -e 'using Pkg; Pkg.instantiate()'
          julia --project=gen gen/generate.jl "$RUNNER_TEMP/powerio/powerio-capi/include/powerio.h"
          git add -N .
          git diff --exit-code -- src/LibPowerIO.jl || {
            echo "::error::src/LibPowerIO.jl is stale; run 'julia --project=gen gen/generate.jl' and commit the result"
            exit 1
          }
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1.12.0
        env:
          POWERIO_CAPI: ${{ steps.powerio.outputs.available == 'true' && format('{0}/powerio/target/release/libpowerio_capi.so', runner.temp) || '' }}
          POWERIO_HEADER: ${{ runner.temp }}/powerio/powerio-capi/include/powerio.h

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1'
      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0
      # The module loads without the C library (resolution is lazy and
      # doctest=false), so the docs build needs no Rust toolchain.
      - name: Instantiate docs environment
        run: julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs docs/make.jl
