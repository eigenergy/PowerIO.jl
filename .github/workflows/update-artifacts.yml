name: Update artifacts

# The reviewed release intent owns the Julia version, powerio tag, changelog,
# and immutable source digest. This workflow can change only Artifacts.toml.
# A powerio release dispatch is the fast path, the schedule is the backstop,
# and manual dispatch retries the same intent without an authority override.
on:
  schedule:
    - cron: "23 5 * * *"
  repository_dispatch:
    types: [powerio-release]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  actions: write

concurrency:
  group: update-artifacts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1"
      - name: Instantiate the release tools
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Check the reviewed intent and event
        id: intent
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
        run: |
          julia --project=. gen/release_state.jl initial \
            "$EVENT_NAME" "$DISPATCH_TAG" "$RUNNER_TEMP/intent-status.toml"
          julia --project=. gen/release_state.jl github-output \
            "$RUNNER_TEMP/intent-status.toml" "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/intent-status.toml" >> "$GITHUB_STEP_SUMMARY"

      - name: Read the exact release and registry state
        id: gate
        if: steps.intent.outputs.status == 'ready'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.intent.outputs.tag }}
        run: |
          release="$RUNNER_TEMP/powerio-release.json"
          code=$(curl --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --output "$release" --write-out '%{http_code}' \
            "https://api.github.com/repos/eigenergy/powerio/releases/tags/$TAG")
          case "$code" in
            200) release_arg="$release" ;;
            404) release_arg=- ;;
            *) echo "::error::GitHub release API returned HTTP $code"; exit 1 ;;
          esac

          open_prs=$(gh pr list --state open --limit 100 --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("artifacts/"))] | length')
          general="$RUNNER_TEMP/Versions.toml"
          code=$(curl --silent --show-error --location \
            --output "$general" --write-out '%{http_code}' \
            https://raw.githubusercontent.com/JuliaRegistries/General/master/P/PowerIO/Versions.toml)
          julia --project=. gen/release_state.jl check-registry-http "$code"

          julia --project=. gen/release_state.jl release \
            "$release_arg" "$open_prs" "$general" "$RUNNER_TEMP/release-status.toml"
          julia --project=. gen/release_state.jl github-output \
            "$RUNNER_TEMP/release-status.toml" "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/release-status.toml" >> "$GITHUB_STEP_SUMMARY"

      - name: Repair a missing Julia tag or release
        if: steps.gate.outputs.status == 'registered'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.intent.outputs.version }}
        run: |
          code=$(curl --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --output "$RUNNER_TEMP/julia-release.json" --write-out '%{http_code}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION")
          action=$(julia --project=. gen/release_state.jl tagbot-action registered "$code")
          if [ "$action" = dispatch ]; then
            gh workflow run TagBot.yml --ref main
            echo "PowerIO $VERSION is registered; dispatched TagBot repair." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "PowerIO $VERSION is registered and its GitHub release exists."
          fi

      - name: Regenerate Artifacts.toml
        id: artifact
        if: steps.gate.outputs.status == 'ready'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.intent.outputs.tag }}
        run: |
          julia --project=. gen/update_artifacts.jl "$TAG" \
            --status-file "$RUNNER_TEMP/artifact-status.toml"
          julia --project=. gen/release_state.jl github-output \
            "$RUNNER_TEMP/artifact-status.toml" "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/artifact-status.toml" >> "$GITHUB_STEP_SUMMARY"

      - name: Test the exact release tree
        if: steps.artifact.outputs.status == 'ready'
        env:
          VERSION: ${{ steps.intent.outputs.version }}
        run: |
          julia --project=. gen/release_state.jl check
          # The interpolation below belongs to Julia.
          # shellcheck disable=SC2016
          julia --project=. -e '
            using PowerIO
            version = ENV["VERSION"]
            PowerIO.library_available() || error("artifact failed the core ABI handshake")
            f = PowerIO.features()
            all(values(f)) || error("artifact is missing a usable feature: $f")
            for name in ("arrow", "matrix", "gridfm", "dist", "pkg", "prob")
                PowerIO.has_feature(name) || error("artifact does not report feature $name")
            end
            PowerIO.schema_versions().powerio_version == version ||
                error("schema report does not identify powerio $version")
            info = PowerIO.build_info()
            info === nothing && error("artifact has no build information")
            String(info.powerio_version) == version || error("build report version mismatch")
          '
          julia --project=. -e 'using Pkg; Pkg.test()'
          git diff --name-only --exit-code -- . ':!Artifacts.toml'

      - name: Commit the artifact and dispatch exact SHA registration
        if: steps.artifact.outputs.status == 'ready'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.intent.outputs.base_sha }}
          CHANGED: ${{ steps.artifact.outputs.changed }}
          VERSION: ${{ steps.intent.outputs.version }}
          TAG: ${{ steps.intent.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$CHANGED" = true ]; then
            [ "$(git diff --name-only)" = "Artifacts.toml" ] || {
              echo "::error::the updater changed a file other than Artifacts.toml"; exit 1;
            }
            git add Artifacts.toml
            [ "$(git diff --cached --name-only)" = "Artifacts.toml" ] || {
              echo "::error::the release commit contains a file other than Artifacts.toml"; exit 1;
            }
            git commit -m "release: pin powerio $TAG"
            git fetch origin main
            julia --project=. gen/release_state.jl check-main-sha "$BASE_SHA"
            git push origin HEAD:refs/heads/main
          else
            git diff --quiet || {
              echo "::error::generator reported changed=false with a dirty tree"; exit 1;
            }
          fi
          expected_sha=$(git rev-parse HEAD)
          gh workflow run register.yml --ref main \
            -f version="$VERSION" -f expected_sha="$expected_sha"
          echo "Dispatched registration for PowerIO $VERSION at $expected_sha." \
            | tee -a "$GITHUB_STEP_SUMMARY"
