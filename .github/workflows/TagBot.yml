name: TagBot

# Tags vX.Y.Z and creates the GitHub release here after each PowerIO version
# merges into the General registry. Triggered by the JuliaTagBot service
# commenting on the TagBot trigger issue; a manual dispatch is the recovery
# path (TagBot re-scans all registered versions on every run).
on:
  issue_comment:
    types: [ created ]
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write
  issues: read
  pull-requests: read
  statuses: read

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
