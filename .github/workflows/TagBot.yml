name: TagBot

# Tags vX.Y.Z and creates the GitHub release here after each PowerIO version
# merges into the General registry. Triggered by the JuliaTagBot service
# commenting on the TagBot trigger issue; a manual dispatch is the recovery
# path (TagBot re-scans all registered versions on every run).
on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          # TAGBOT_TOKEN is optional, but fixes backfills for old registered
          # versions whose tagged commits changed workflow files.
          token: ${{ secrets.TAGBOT_TOKEN || secrets.GITHUB_TOKEN }}
          # Prefer a dedicated write deploy key; reuse a Documenter key if the
          # repository already has one.
          ssh: ${{ secrets.TAGBOT_SSH || secrets.DOCUMENTER_KEY }}
