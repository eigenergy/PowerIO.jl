name: TagBot

# Tags vX.Y.Z and creates the GitHub release here after each PowerIO version
# merges into the General registry. Triggered by the JuliaTagBot service
# commenting on the TagBot trigger issue; a manual dispatch is the recovery
# path (TagBot re-scans all registered versions on every run).
on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@cded32665b34ca0496d3ac10a67d08ddfc726963 # v1
        with:
          token: ${{ secrets.TAGBOT_TOKEN || secrets.GITHUB_TOKEN }}
          # The TAGBOT_SSH write deploy key does the tag pushes. The default
          # token cannot tag a commit once any workflow file changed after it
          # (GitHub requires the tagged commit's .github/workflows tree to
          # match a branch tip: github.com/orgs/community/discussions/26164),
          # which breaks every backfill and any release racing a workflow
          # edit.
          ssh: ${{ secrets.TAGBOT_SSH || secrets.DOCUMENTER_KEY }}
